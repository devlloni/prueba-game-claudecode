<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable"            content="yes" />
  <meta name="apple-mobile-web-app-capable"      content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Pixel Hop Adventure</title>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed; inset: 0;
      padding-top:   env(safe-area-inset-top,   0px);
      padding-left:  env(safe-area-inset-left,  0px);
      padding-right: env(safe-area-inset-right, 0px);
      background: #000;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Press Start 2P', monospace;
      overscroll-behavior: none;
      touch-action: none;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #game-container {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Portrait-mode rotate notice ──────────────────────────────────────── */
    #rotate-notice {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: #050516;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
      padding: 32px;
      text-align: center;
    }
    #rotate-notice .icon {
      font-size: 56px;
      animation: spin-hint 1.6s ease-in-out infinite alternate;
    }
    #rotate-notice p {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(9px, 3vw, 13px);
      color: #FFD700;
      line-height: 1.8;
    }
    @keyframes spin-hint {
      from { transform: rotate(0deg); }
      to   { transform: rotate(90deg); }
    }
    /* Show notice only in portrait on touch devices */
    @media (orientation: portrait) and (hover: none) {
      #rotate-notice { display: flex; }
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet" />
</head>
<body>
  <!-- Portrait-mode hint (hidden in landscape) -->
  <div id="rotate-notice" aria-hidden="true">
    <div class="icon">📱</div>
    <p>ROTATE YOUR DEVICE<br>FOR THE BEST EXPERIENCE</p>
  </div>

  <div id="game-container"></div>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

  <!-- Game modules (load order matters) -->
  <script src="src/utils/SoundManager.js"></script>
  <script src="src/utils/MobileControls.js"></script>
  <script src="src/TextureFactory.js"></script>
  <script src="src/data/LevelData.js"></script>
  <script src="src/sprites/Player.js"></script>
  <script src="src/sprites/Enemy.js"></script>
  <script src="src/sprites/PowerUp.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/HUDScene.js"></script>
  <script src="src/scenes/GameOverScene.js"></script>
  <script src="src/scenes/LevelCompleteScene.js"></script>
  <script src="src/scenes/WinScene.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
