<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Pixel Hop Adventure</title>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html {
      /* Use the full visual viewport including notch/home-indicator areas */
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
      /* Respect device safe areas (notch, home indicator) */
      padding-top:    env(safe-area-inset-top,    0px);
      padding-left:   env(safe-area-inset-left,   0px);
      padding-right:  env(safe-area-inset-right,  0px);
      /* bottom padding handled by MobileControls when present */
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      /* Prevent elastic scroll bounce on iOS */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      touch-action: none;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Prevent iOS long-press context menu on canvas */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="game-container"></div>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

  <!-- Game modules (order matters) -->
  <script src="src/utils/MobileControls.js"></script>
  <script src="src/TextureFactory.js"></script>
  <script src="src/data/LevelData.js"></script>
  <script src="src/sprites/Player.js"></script>
  <script src="src/sprites/Enemy.js"></script>
  <script src="src/sprites/PowerUp.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/HUDScene.js"></script>
  <script src="src/scenes/GameOverScene.js"></script>
  <script src="src/scenes/LevelCompleteScene.js"></script>
  <script src="src/scenes/WinScene.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
